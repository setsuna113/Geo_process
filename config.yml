pipeline:
  quality_thresholds:
    max_nan_ratio: 0.99
    min_completeness: 0.01
    max_outlier_ratio: 0.05
    min_coverage: 0.5
merge:
  enable_chunked_processing: true
  chunk_size: 5000
  enable_validation: true
  alignment_tolerance: 0.01
resampling:
  target_resolution: 0.166744
  target_crs: EPSG:4326
  strategies:
    richness_data: sum
    continuous_data: average
    categorical_data: majority
  chunk_size: 1000
  validate_output: true
  preserve_sum: true
  cache_resampled: true
  engine: numpy
  window_size: 2048
  window_overlap: 128
  skip_data_loading_for_passthrough: true
  allow_skip_resampling: true
  resolution_tolerance: 0.001
  force_passthrough_for_skip: true
storage:
  chunk_size: 100000
  chunk_rows: 20000
  aggregate_to_grid: true
  grid_cell_size: 0.05
  batch_insert_size: 50000
  enable_progress_logging: true
  memory_cleanup_interval: 5
datasets:
  target_datasets:
  - name: plants-richness
    path: /scratch/yl998/downsampled_rasters/plants-richness_downsampled_0.16667.tif
    data_type: richness_data
    band_name: plants_richness
    enabled: true
    skip_resampling: true
  - name: terrestrial-richness
    path: /scratch/yl998/downsampled_rasters/terrestrial-richness_downsampled_0.16667.tif
    data_type: richness_data
    band_name: terrestrial_richness
    enabled: true
    skip_resampling: true
  - name: am-fungi-richness
    path: /scratch/yl998/downsampled_rasters/am-fungi-richness_downsampled_0.16667.tif
    data_type: continuous_data
    band_name: am_fungi_richness
    enabled: true
    skip_resampling: true
  - name: ecm-fungi-richness
    path: /scratch/yl998/downsampled_rasters/ecm-fungi-richness_downsampled_0.16667.tif
    data_type: continuous_data
    band_name: ecm_fungi_richness
    enabled: true
    skip_resampling: true
  plants: /maps/mwd24/richness/daru-plants-richness.tif
  animals: /maps/mwd24/richness/iucn-terrestrial-richness.tif
  am_fungi: /scratch/yl998/resampled_rasters/AM_Fungi_Richness_Predicted_resampled_0.016667.tif
  ecm_fungi: /scratch/yl998/resampled_rasters/EcM_Fungi_Richness_Predicted_resampled_0.016667.tif
processing:
  memory_limit_gb: 300
  chunk_size: 10000
  enable_chunking: true
  checkpoint_interval: 5
  merge_chunk_size: 2000
  lazy_merge_threshold_mb: 1000
  subsampling:
    enabled: false
    max_samples: 500000000
    memory_limit_gb: 180
    strategy: random
    min_samples_per_class: 1000
    spatial_block_size: 200
  max_workers: 200
  batch_size: 5000
raster_processing:
  memory_limit_mb: 80000
  max_chunk_size_mb: 2000
  parallel_workers: 150
  tile_size: 1024
  cache_ttl_days: 30
  lazy_loading:
    chunk_size_mb: 2000
    prefetch_tiles: 5
  resampling_methods:
    default: bilinear
    categorical: nearest
    continuous: bilinear
  compression:
    method: lzw
    level: 6
spatial_analysis_memory:
  max_pixels_in_memory: 100000000
  memory_overhead_factor: 2.0
  use_memory_mapping: false
database:
  host: localhost
  port: 51051
  database: geo_cluster_db
  user: yl998
  password: '123456'
  max_connections: 20
  connection_timeout: 30
  retry_attempts: 3
database_schema_mapping:
  raster_sources:
    geometry_column: spatial_extent
    fallback_geometry_columns:
    - bounds
    - geometry
    - geom
    - shape
    active_column: active
    status_column: processing_status
    metadata_column: metadata
  grid_cells:
    geometry_column: geometry
    fallback_geometry_columns:
    - geom
    - shape
    - bounds
    active_column: null
    metadata_column: null
grids:
  cubic:
    resolutions:
    - 1000
    - 5000
    - 10000
    - 25000
    crs: EPSG:3857
    default_resolution: 5000
  hexagonal:
    resolutions:
    - 6
    - 7
    - 8
    - 9
    crs: EPSG:4326
    default_resolution: 8
output_paths:
  working_dir: /scratch/yl998/geo_working
  results_dir: /scratch/yl998/geo_results
  temp_dir: /scratch/yl998/geo_temp
processing_bounds:
  tiny_test:
  - -1
  - -1
  - 1
  - 1
  test_small:
  - -10
  - -10
  - 10
  - 10
  global:
  - -180
  - -90
  - 180
  - 90
  europe:
  - -25.0
  - 35.0
  - 50.0
  - 75.0
  north_america:
  - -170.0
  - 15.0
  - -50.0
  - 75.0
  south_america:
  - -85.0
  - -60.0
  - -30.0
  - 15.0
  africa:
  - -25.0
  - -40.0
  - 55.0
  - 40.0
  asia:
  - 60.0
  - -15.0
  - 180.0
  - 75.0
  oceania:
  - 110.0
  - -50.0
  - 180.0
  - -10.0
species_filters:
  min_occurrence_count: 5
  exclude_uncertain_coordinates: true
  coordinate_precision_threshold: 0.01
  exclude_cultivated: true
  exclude_fossil: false
  max_year: 2024
  exclude_future_dates: true
features:
  climate_variables:
  - bio_1
  - bio_12
  richness_types:
  - present
  - absent
  - fossil
export:
  formats:
  - parquet
  compress: true
  chunk_size: 50000
  include_metadata: true
  enable_streaming: true
monitoring:
  enable_database_logging: true
  log_batch_size: 100
  log_flush_interval: 5
  enable_metrics: true
  metrics_interval: 10
output_formats:
  csv: true
  parquet: true
  geojson: false
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
data_preparation:
  validation:
    check_crs: true
    check_bounds: false
    check_nodata: true
    check_dtypes: true
    bounds_tolerance: 0.01
  cleaning:
    remove_duplicates: true
    handle_missing_values: true
    validate_geometries: true
data_cleaning:
  outlier_detection:
    method: iqr
    threshold: 1.5
  coordinate_cleaning:
    precision_threshold: 0.001
    remove_zero_coordinates: true
    validate_country_boundaries: false
testing:
  use_test_database: true
  test_database_name: geo_test_db
  cleanup_after_tests: true
  small_dataset_size: 1000
  integration_test_timeout: 300
spatial_analysis:
  defaults:
    data_source: parquet
    save_results: true
    save_intermediate: false
    keep_results_in_memory: false
    chunk_size: 10000
    memory_limit_gb: 8.0
    enable_checkpointing: true
    checkpoint_interval: 100
  experiments:
    test_som_small:
      input_parquet: outputs/test_biodiversity_sample.parquet
      method: som
    test_som:
      input_parquet: /scratch/yl998/biodiversity_climate_fine_v5.parquet
      method: som
    production_som:
      input_parquet: /scratch/yl998/biodiversity_climate_production_1x_corrected.parquet
      method: som
    test_gwpca:
      input_parquet: outputs/test_biodiversity.parquet
      method: gwpca
    production_gwpca:
      input_parquet: outputs/biodiversity_global.parquet
      method: gwpca
    test_cpwopt:
      input_parquet: data/test_cpwopt_biodiversity.parquet
      method: cpwopt
    sparse_cpwopt:
      input_parquet: data/sparse_biodiversity.parquet
      method: cpwopt
    production_cpwopt:
      input_parquet: data/merged/biodiversity_climate_1x_production.parquet
      method: cpwopt
    test_cpwopt_small:
      input_parquet: outputs/test_biodiversity_sample.parquet
      method: cpwopt
    test_kmeans_hierarchical:
      input_parquet: data/merged/biodiversity_climate_1x_production.parquet
      method: kmeans_hierarchical
    production_kmeans_hierarchical:
      input_parquet: data/merged/biodiversity_climate_1x_production.parquet
      method: kmeans_hierarchical
    test_maxp:
      input_parquet: outputs/test_biodiversity.parquet
      method: maxp_regions
    test_kmeans:
      input_parquet: outputs/test_biodiversity_sample.parquet
      method: kmeans
    test_kmeans_auto_k:
      input_parquet: outputs/test_biodiversity.parquet
      method: kmeans
    production_kmeans:
      input_parquet: outputs/biodiversity_global.parquet
      method: kmeans
regression_analysis:
  preprocessing:
    missing_data:
      strategy: complete_case
    standardization:
      method: gelman
      scale_factor: 2
    spatial_grid_step: 100
  glm:
    distribution: negative_binomial
    family: negative_binomial
    link: log
    max_iterations: 100
  dml:
    n_folds: 5
    n_bootstrap: 100
    gbm_params:
      ntrees: 100
      max_depth: 6
      learn_rate: 0.1
  compute:
    h2o_max_memory: 32G
    h2o_min_memory: 8G
  spatial:
    mesf_eigenvectors: 10
    mesf_threshold: 0.25
    distance_threshold: 100000

# Google Earth Engine Configuration - Improved Structure
# This configuration file controls the GEE data processing workflow

# Experiment name
experiment_name: "test_pipeline_verification"

# =============================================================================
# DATA SOURCES
# =============================================================================

# Biodiversity datasets to process
biodiversity_datasets:
  - name: "animals"
    gcs_path: "data/test_biodiversity/test_animals.tif"
    band_name: "animal_richness"
    description: "Animal species richness"
    no_data_value: -3.4e+38
    asset_name: "test_animals_richness"
    
  - name: "plants"
    gcs_path: "data/test_biodiversity/test_plants.tif"
    band_name: "plant_richness"
    description: "Plant species richness"
    no_data_value: -3.4e+38
    asset_name: "test_plants_richness"
    
  - name: "fungi"
    gcs_path: "data/test_biodiversity/test_fungi.tif"
    band_name: "fungi_richness"
    description: "Fungi species richness"
    no_data_value: -3.4e+38
    asset_name: "test_fungi_richness"

# =============================================================================
# ADDITIONAL DATA LAYERS (from GEE catalog)
# =============================================================================

additional_layers:
  # Climate data
  climate:
    enabled: true  # Set to false to exclude climate data
    source: "WORLDCLIM/V1/BIO"  # GEE asset ID
    variables:  # Which bioclimatic variables to include
      - "bio01"  # Annual Mean Temperature
      - "bio04"  # Temperature Seasonality
      - "bio12"  # Annual Precipitation
      - "bio15"  # Precipitation Seasonality
    # Could add more: bio02-bio19 available
    
  # Elevation data
  elevation:
    enabled: true  # Set to false to exclude elevation
    source: "MERIT/DEM/v1_0_3"
    band: "dem"
    description: "Elevation in meters, ~90m resolution"
    
  # Future: Add more GEE datasets as needed
  # soil:
  #   enabled: false
  #   source: "OpenLandMap/SOL/SOL_ORGANIC-CARBON_USDA-6A1C_M/v02"
  #   bands: ["b0", "b10", "b30"]
  
  # landcover:
  #   enabled: false
  #   source: "MODIS/006/MCD12Q1"
  #   band: "LC_Type1"

# =============================================================================
# MASKING OPTIONS
# =============================================================================

masking:
  enabled: true  # Single on/off switch for all masking
  
  # The unified mask excludes:
  # 1. Deep ocean (MODIS water class 0)
  # 2. Areas outside latitude bounds
  # Note: Shallow water (class 2) is kept for coastal biodiversity
  
  latitude_bounds:
    min: -60  # Southern bound (no fungi data beyond)
    max: 75   # Northern bound (minimal fungi data beyond)

# =============================================================================
# PROCESSING OPTIONS
# =============================================================================

processing:
  merge_strategy: "addBands"  # How to combine datasets
  tileScale: 16              # For large exports
  maxPixels: 10000000000000  # 1e13

# =============================================================================
# OUTPUT RESOLUTIONS
# =============================================================================

resolutions:
  fine:
    name: "fine"
    resolution: 0.00898315284  # ~1km in degrees (1000m / 111320m per degree)
    description: "Fine resolution (~1km)"

# =============================================================================
# INFRASTRUCTURE
# =============================================================================

# Google Cloud Storage
gcs:
  bucket: "biodiv-gee-yl998"
  upload_folder: "test_uploads"
  export_folder: "test_merged_outputs"
  chunk_size_mb: 100
  parallel_uploads: 4

# Earth Engine
earth_engine:
  asset_prefix: "projects/earthengine-legacy/assets/users/geebiodiversity/test_pipeline"
  project_id: "triple-carrier-441622-t1"  # Update with your GCP project
  
# Authentication (for backward compatibility)
gee:
  auth:
    method: "service_account"
    service_account_key: ".gee/service-account-key.json"
    project_id: "triple-carrier-441622-t1"

# Export settings
export:
  format: "GeoTIFF"  # or "CSV"
  destination: "cloud_storage"
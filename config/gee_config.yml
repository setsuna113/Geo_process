# Google Earth Engine Configuration - PRODUCTION
# This configuration uses real biodiversity data

# Experiment name
experiment_name: "production_coarse_40x"

# =============================================================================
# DATA SOURCES
# =============================================================================

# Biodiversity datasets to process
biodiversity_datasets:
  - name: "animals"
    gcs_path: "data/richness_maps/iucn-terrestrial-richness.tif"
    band_name: "animal_richness"
    description: "IUCN terrestrial animal species richness"
    no_data_value: -3.4e+38
    asset_name: "iucn_terrestrial_richness"
    
  - name: "plants"
    gcs_path: "data/richness_maps/daru-plants-richness.tif"
    band_name: "plant_richness"
    description: "Daru plant species richness"
    no_data_value: -3.4e+38
    asset_name: "daru_plants_richness"
    
  - name: "fungi"
    gcs_path: "data/fungal/spun/AM_fungi/AM_Fungi_Richness_Predicted.tif"
    band_name: "fungi_richness"
    description: "AM Fungi species richness"
    no_data_value: -3.4e+38
    asset_name: "am_fungi_richness"

# =============================================================================
# ADDITIONAL DATA LAYERS (from GEE catalog)
# =============================================================================

additional_layers:
  # Climate data
  climate:
    enabled: true
    source: "WORLDCLIM/V1/BIO"
    variables:
      - "bio01"  # Annual Mean Temperature
      - "bio04"  # Temperature Seasonality
      - "bio12"  # Annual Precipitation
      - "bio15"  # Precipitation Seasonality
    
  # Elevation data
  elevation:
    enabled: true
    source: "MERIT/DEM/v1_0_3"
    band: "dem"
    description: "Elevation in meters, ~90m resolution"

# =============================================================================
# MASKING OPTIONS
# =============================================================================

masking:
  enabled: true
  latitude_bounds:
    min: -60  # Southern bound (no fungi data beyond)
    max: 75   # Northern bound (minimal fungi data beyond)

# =============================================================================
# PROCESSING OPTIONS
# =============================================================================

processing:
  merge_strategy: "addBands"
  tileScale: 16
  maxPixels: 10000000000000  # 1e13

# =============================================================================
# OUTPUT RESOLUTIONS
# =============================================================================

# Control which resolutions to process
resolution_settings:
  # Process multiple resolutions in single run or just selected ones
  process_resolutions: ["fine", "coarse"]  # Process both resolutions
  # To process all: ["fine", "coarse"]
  # To process just one: ["fine"]

# Available resolution definitions
resolutions:
  fine:
    name: "fine"
    resolution: 0.008983152841195  # Keep original fungi resolution to avoid resampling issues
    description: "Fine resolution matching fungi data (~1km)"
  coarse:
    name: "coarse"
    resolution: 0.35932  # 40x aggregation (~40km, 1600 pixels per output)
    description: "Coarse resolution for ML (~40km, 40x40 aggregation)"
  # Alternative options:
  # medium_10x:
  #   resolution: 0.08983  # 10x aggregation (~10km, 100 pixels per output)
  # maximum_43x:
  #   resolution: 0.38627  # 43x aggregation (~43km, 1849 pixels - max safe)

# =============================================================================
# INFRASTRUCTURE
# =============================================================================

# Google Cloud Storage
gcs:
  bucket: "biodiv-gee-yl998"
  upload_folder: "production_uploads"
  export_folder: "production_merged_outputs"
  chunk_size_mb: 100
  parallel_uploads: 4

# Earth Engine
earth_engine:
  asset_prefix: "projects/earthengine-legacy/assets/users/geebiodiversity/production"
  project_id: "triple-carrier-441622-t1"
  
# Authentication
gee:
  auth:
    method: "service_account"
    service_account_key: ".gee/service-account-key.json"
    project_id: "triple-carrier-441622-t1"

# Export settings
export:
  format: "GeoTIFF"
  destination: "cloud_storage"
  
  # No explicit bounds - will use global with latitude masking
  # Hemisphere splitting - disable for testing coarse resolution fix
  hemisphere_split:
    enabled: false  # Disable to test coarse resolution without hemisphere complexity
# Google Earth Engine Configuration - PRODUCTION
# This configuration uses real biodiversity data

# Experiment name
experiment_name: "production_full_with_ecm"

# =============================================================================
# DATA SOURCES
# =============================================================================

# Biodiversity datasets to process
biodiversity_datasets:
  - name: "animals"
    path: "data/richness_maps/iucn-terrestrial-richness.tif"
    band_name: "animal_richness"
    description: "IUCN terrestrial animal species richness"
    no_data_value: -3.4e+38
    asset_name: "iucn_terrestrial_richness"
    resampling: "max"  # Preserve biodiversity hotspots
    
  - name: "plants"
    path: "data/richness_maps/daru-plants-richness.tif"
    band_name: "plant_richness"
    description: "Daru plant species richness"
    no_data_value: -3.4e+38
    asset_name: "daru_plants_richness"
    resampling: "max"  # Preserve biodiversity hotspots
    
  - name: "am_fungi"
    path: "data/fungal/spun/AM_fungi/AM_Fungi_Richness_Predicted.tif"
    band_name: "am_fungi_richness"
    description: "AM Fungi species richness"
    no_data_value: -3.4e+38
    asset_name: "am_fungi_richness"
    resampling: "bilinear"  # For predicted surface
    
  - name: "am_fungi_cv"
    path: "data/fungal/spun/AM_fungi/AM_Fungi_Richness_CoeffVar.tif"
    band_name: "am_fungi_coeff_var"
    description: "AM Fungi coefficient of variation"
    no_data_value: -3.4e+38
    asset_name: "am_fungi_coeff_var"
    resampling: "rms"  # RMS aggregation for coefficient of variation
    
  - name: "ecm_fungi"
    path: "data/fungal/spun/EcM_fungi/EcM_Fungi_Richness_Predicted.tif"
    band_name: "ecm_fungi_richness"
    description: "EcM Fungi species richness"
    no_data_value: -3.4e+38
    asset_name: "ecm_fungi_richness"
    resampling: "bilinear"  # For predicted surface
    
  - name: "ecm_fungi_cv"
    path: "data/fungal/spun/EcM_fungi/EcM_Fungi_Richness_CoeffVar.tif"
    band_name: "ecm_fungi_coeff_var"
    description: "EcM Fungi coefficient of variation"
    no_data_value: -3.4e+38
    asset_name: "ecm_fungi_coeff_var"
    resampling: "rms"  # RMS aggregation for coefficient of variation

# =============================================================================
# ADDITIONAL DATA LAYERS (from GEE catalog)
# =============================================================================

additional_layers:
  # Climate data
  climate:
    enabled: true
    source: "WORLDCLIM/V1/BIO"
    variables:
      - "bio01"  # Annual Mean Temperature
      - "bio04"  # Temperature Seasonality
      - "bio12"  # Annual Precipitation
      - "bio15"  # Precipitation Seasonality
    
  # Elevation data
  elevation:
    enabled: true
    source: "MERIT/DEM/v1_0_3"
    band: "dem"
    description: "Elevation in meters, ~90m resolution"

# =============================================================================
# MASKING OPTIONS
# =============================================================================

masking:
  enabled: true
  
  # Ocean mask source
  ocean_mask_source: "MODIS/006/MOD44W/2015_01_01"
  ocean_mask_band: "water_mask"
  
  # Latitude bounds
  latitude_bounds:
    min: -60  # Southern bound (no fungi data beyond)
    max: 75   # Northern bound (minimal fungi data beyond)
  
  # Note: Ocean mask strategies are defined per resolution in resolution_settings.outputs

# =============================================================================
# PROCESSING OPTIONS
# =============================================================================

processing:
  merge_strategy: "addBands"
  tileScale: 16
  maxPixels: 10000000000000  # 1e13

# =============================================================================
# OUTPUT RESOLUTIONS
# =============================================================================

# Recursive downsampling configuration
# Each level represents 2x downsampling from the previous level
resolution_settings:
  # Base resolution for alignment (all datasets aligned to this first)
  base_resolution: 0.016666666666667  # ~1.85km at equator
  
  # Which resolutions to export with their ocean mask strategies
  # Each number represents power of 2 downsampling (max 8x recommended)
  outputs:
    1x: 
      enabled: true   # Base resolution (0.0167°, ~1.85km)
      ocean_mask:
        method: "original"  # Use RAW MODIS mask (500m) - no aggregation needed
        description: "Conservative: MODIS is 3.7x finer than 1x data"
    2x: 
      enabled: false  # One 2x downsample (0.0334°, ~3.7km)
      ocean_mask:
        method: "reduceResolution"
        reducer: "mean"
        threshold: 0.5  # >50% water = masked
        maxPixels: 64
    4x: 
      enabled: true   # Two 2x downsamples (0.0668°, ~7.4km)
      ocean_mask:
        method: "disabled"  # Temporarily disabled due to reprojection issues
        description: "Ocean mask causing reprojection errors - using latitude bounds only"
    8x: 
      enabled: false  # Three 2x downsamples (0.1336°, ~14.8km)
      ocean_mask:
        method: "reduceResolution"
        reducer: "mode"  # Most common value (land or water)
        maxPixels: 1024

# =============================================================================
# INFRASTRUCTURE
# =============================================================================

# Google Cloud Storage
gcs:
  bucket: "biodiv-gee-yl998"
  upload_folder: "production_uploads"
  export_folder: "production_merged_outputs"
  chunk_size_mb: 100
  parallel_uploads: 4

# Earth Engine
earth_engine:
  asset_prefix: "projects/earthengine-legacy/assets/users/geebiodiversity/production"
  project_id: "triple-carrier-441622-t1"
  
# Authentication
gee:
  auth:
    method: "service_account"
    service_account_key: ".gee/service-account-key.json"
    project_id: "triple-carrier-441622-t1"
  
  upload:
    bucket: "biodiv-gee-yl998"
    asset_prefix: "projects/earthengine-legacy/assets/users/geebiodiversity/production"
    chunk_size_mb: 100
    parallel_uploads: 4
  
  export:
    destination: "cloud_storage"
    folder: "merged_outputs"
    format: "GeoTIFF"
    timeout: 7200
    check_interval: 30

# Export settings
export:
  format: "GeoTIFF"
  destination: "cloud_storage"
  
  # No explicit bounds - will use global with latitude masking
  # Hemisphere splitting - disable for testing coarse resolution fix
  hemisphere_split:
    enabled: false  # Disable to test coarse resolution without hemisphere complexity
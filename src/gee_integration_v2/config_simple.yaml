# GEE Integration Configuration
# 生产环境配置

gee:
  auth:
    service_account_key: .gee/service-account-key.json
    project_id: triple-carrier-441622-t1
  
  upload:
    bucket: biodiv-gee-yl998

# 输出路径
output_dir: /scratch/yl998/gee_outputs
state_dir: /scratch/yl998/gee_state

# 基础分辨率 - 所有数据对齐到这个分辨率并输出
base_resolution: 0.016666666666667  # ~1.85km (1/60度)

# 生物多样性数据集（GEE Assets）
biodiversity_assets:
  plants_richness: projects/triple-carrier-441622-t1/assets/plants_richness
  terrestrial_richness: projects/triple-carrier-441622-t1/assets/terrestrial_richness
  am_fungi_richness: projects/triple-carrier-441622-t1/assets/am_fungi_richness
  ecm_fungi_richness: projects/triple-carrier-441622-t1/assets/ecm_fungi_richness

# 生物多样性数据的处理方法
biodiversity_reducers:
  plants_richness: max
  terrestrial_richness: max
  am_fungi_richness: mean
  ecm_fungi_richness: mean

# 外部数据集配置
external_datasets:
  - name: climate
    image: WORLDCLIM/V1/BIO
    bands: [bio01, bio04, bio12, bio15]
    rename: [annual_temp, temp_seasonality, annual_precip, precip_seasonality]
  
  - name: elevation
    image: MERIT/DEM/v1_0_3
    bands: [dem]
    rename: [elevation]
  
  - name: pet
    collection: IDAHO_EPSCOR/TERRACLIMATE
    bands: [pet]
    reducer: mean
    filter_dates: ['2000-01-01', '2020-12-31']
    rename: [pet]
  
  - name: soil_sand
    image: projects/soilgrids-isric/sand_mean
    bands: [sand_0-5cm_mean]
    rename: [sand_content_pct]
  
  - name: soil_carbon
    image: projects/soilgrids-isric/soc_mean
    bands: [soc_0-5cm_mean]
    rename: [soil_organic_carbon]
  
  - name: soil_ph
    image: projects/soilgrids-isric/phh2o_mean
    bands: [phh2o_0-5cm_mean]
    rename: [soil_ph]
  
  - name: modis_vegetation_cover
    collection: MODIS/061/MOD44B  # 250m resolution, annual
    bands: [Percent_Tree_Cover, Percent_NonTree_Vegetation, Percent_NonVegetated]
    reducer: mean
    filter_dates: ['2015-01-01', '2024-03-05']  # Latest 10 years (MOD44B available through March 2024)
    rename: [modis_tree_cover_pct, modis_nontree_veg_pct, modis_bare_ground_pct]
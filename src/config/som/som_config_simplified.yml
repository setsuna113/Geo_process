# Simplified SOM Configuration
# This configuration maintains full functionality with clearer organization
# 
# USAGE:
# - For testing: Use as-is (15 epochs, 20x20 grid, spatial_grid_step=100)
# - For production: Override via environment variables or extend this config
#
# Environment variable overrides (optional):
#   SOM_MAX_EPOCHS=1000
#   SOM_GRID_SIZE=60
#   SOM_SPATIAL_GRID_STEP=1
#   SOM_N_WORKERS=150

# ============================================================================
# PREPROCESSING - Data preprocessing before SOM training
# ============================================================================

preprocessing:
  missing_strategy: 'keep'     # 'keep' = let SOM handle missing with min_valid_features
                                # 'complete' = drop incomplete samples (loses too much data)
                                # 'zero' = fill NaN with 0 (distorts standardization)
                                # 'mean' = fill with column mean
                                # 'median' = fill with column median

# ============================================================================
# CORE SETTINGS - Essential parameters that define the SOM
# ============================================================================

# Grid architecture
grid:
  size: [60, 60]          # Number of neurons (rows, cols) - 3600 neurons for production
  topology: 'rectangular'  # Grid topology (hexagonal not yet implemented)

# Data configuration
data:
  # Input data sampling
  spatial_grid_step: 2  # Sample every 2nd spatial point (reduce data by half)
  
  # Feature columns (standardized naming)
  feature_cols: ['plant_richness', 'animal_richness', 'am_fungi_richness', 'ecm_fungi_richness']
  coordinate_columns: ['x', 'y']
  
  # Missing data handling (used when preprocessing.missing_strategy = 'keep')
  min_valid_features: 3   # Minimum features required for valid distance (after fungi combination: plant, animal, total_fungi)

# Distance metrics
distance:
  feature_metric: 'bray_curtis'  # Distance metric for biodiversity features
  geographic_distance: 'haversine'  # Distance metric for geographic coordinates (standardized name)
  spatial_weight: 0.2             # Weight for spatial distance (0.2 = 20% spatial, 80% features)

# ============================================================================
# TRAINING PARAMETERS - Control the learning process
# ============================================================================

training:
  # Basic settings
  max_epochs: 1000         # CHANGED from 500 - Extended training for better convergence
  n_workers: 150        # Number of workers (1 for sequential, >1 for parallel) - optimized for current system resources
  
  # Two-phase training configuration (UPDATED for 1000 epochs)
  # Phase 1: Global organization (wide radius) - 80% of training
  # Phase 2: Fine-tuning (narrow radius, avoiding oscillation zone) - 20% of training
  phase_1_epochs: 800     # Epochs 1-800: Global organization phase (80% of 1000)
  phase_2_epochs: 200     # Epochs 801-1000: Fine-tuning phase (20% of 1000)
    
  # Neighborhood radius (UPDATED for two-phase training)
  radius:
    initial: 30.0         # Initial neighborhood radius (half of 60x60 grid - research validated)
    phase_1_final: 2.0    # End of phase 1 radius (reduced from 3.0 for better convergence)
    final: 1.0            # Final neighborhood radius (optimal for convergence per research)
    decay: 'exponential'  # Decay type: 'linear' or 'exponential'
    delta_flexibility: 0.1 # Random variation ±10% to prevent integer boundary oscillations (NEW)
    
    
  # Momentum (UPDATED - critical for Batch SOM stability)
  momentum:
    initial: 0.3          # CHANGED from 0.0 - Start with 30% momentum for stability
    final: 0.7            # CHANGED from 0.0 - End with 70% momentum (more stability as radius shrinks)
    schedule: 'linear'    # Linear interpolation from initial to final
  
  # Performance optimization
  sparse_influence_threshold: 0.001  # Skip neuron updates when influence < this value
                                     # Speeds up training by skipping negligible updates
                                     # 0.001 = 0.1% of max influence (1.0)
    

# ============================================================================
# CONVERGENCE CRITERIA - Multiple metrics to determine when to stop training
# ============================================================================
# Training stops when ANY of these conditions are met:
# 1. Max epochs reached (see training.max_epochs)
# 2. Patience exceeded (50 epochs without >0.1% QE improvement)
# 3. Convergence achieved: QE stable AND (TE < threshold OR GC > threshold)
#
# The patience counter works as follows:
# - Resets to 0 when QE improves by >0.1%
# - Increments when QE improvement is <0.1% or QE gets worse
# - Training stops when counter reaches patience value

convergence:
  # Quantization Error (QE) criteria
  qe:
    min_improvement: 0.001           # QE must improve by >0.1% to reset patience counter
    # Note: patience counter increments when improvement < 0.1% or QE gets worse
    
  # Topographic Error (TE) criteria  
  topographic_error:
    threshold: 0.05                  # TE < this means good topology preservation
    calculation_frequency: 10        # Calculate TE every N epochs
    # Adaptive radius adjustment based on TE
    adjustment:
      enabled: true                  # Adjust radius based on TE
      high_threshold: 0.15           # TE > this = poor topology (slow down radius decay)
      low_threshold: 0.05            # TE < this = good topology (speed up radius decay)
      high_modifier: 1.1             # Multiplier when TE is high
      low_modifier: 0.95             # Multiplier when TE is low
    
  # Geographic Coherence (GC) criteria - for spatial data
  geographic_coherence:
    threshold: 0.6                   # GC > this means good spatial clustering
    calculation_frequency: 10        # Calculate GC every N epochs
    # weight: 0.3                    # NOT IMPLEMENTED - reserved for weighted logic
    
  # Convergence logic (currently OR-based)
  # Converges when: (QE stable) AND (TE < threshold OR GC > threshold)
  logic: 'or'                        # 'or' = either TE or GC, 'weighted' = combine scores
  
  # Early stopping patience
  patience: 1000                    # Stop after N epochs without meaningful QE improvement (>0.1%) - set to 1000 to ensure full training

# ============================================================================
# TERMINATION - Additional termination criteria
# ============================================================================
termination:
  # Minimum radius termination (VALIDATED - already set correctly!)
  min_radius: 1.0                    # Stop training when radius reaches this value (prevents instability)
                                     # Literature suggests 1.0 as optimal final radius
                                     # With momentum=0.7 and delta_flexibility=0.1, oscillations are controlled
                                     # This works with our two-phase training to prevent oscillations

# ============================================================================
# MONITORING & CHECKPOINTS - Track progress and save state
# ============================================================================

monitoring:
  # Checkpointing
  checkpoint:
    frequency: 10                    # Save every N epochs
    directory: 'checkpoints/som'     # Where to save checkpoints
    
  # Sampling for metrics
  sampling:
    large_sample: 50000              # Sample size for accurate metrics
    qe_sample_size: 20000            # Sample size for QE calculation each epoch
    coherence_sample_threshold: 10000  # If data > this, use sampling for geographic coherence
    coherence_sample_size: 5000      # Number of samples to use for geographic coherence

# ============================================================================
# VALIDATION - Cross-validation settings
# ============================================================================

validation_config:
  cv_folds: 0  # 0 = no CV, use all data for training (production mode)
               # 5 = 5-fold spatial block CV (for model validation)

# ============================================================================
# SPATIAL ANALYSIS - Parameters for geographic coherence and BMU calculations
# ============================================================================

spatial_metrics:
  k_neighbors: 50                  # Neighbors for spatial analysis
  max_distance_km: 500             # Maximum spatial influence
  neighborhood_function: 'gaussian'  # Type of neighborhood function for SOM
  coherence_distance_threshold: 50.0  # Distance threshold for geographic coherence (km)
  earth_radius_km: 6371.0          # Earth radius for haversine distance calculations

# ============================================================================
# NUMBA OPTIMIZATION - Parameters specific to pure Numba implementation
# ============================================================================

numba:
  # Thread control - uniformly controls ALL Numba parallel operations
  # Note: Can also be set via NUMBA_NUM_THREADS environment variable
  # If not set, uses all CPU cores by default
  # max_threads: 100  # Uncomment to limit Numba threads (overrides n_workers)
  
  # Sparse update threshold - skip neurons with influence below this
  sparse_influence_threshold: 0.001
  
  # Geographic distance normalization for combined distance calculations
  geo_distance_norm: 20000.0      # Max earth distance for normalization (~half circumference)
  
  # Default values for missing configuration
  default_geo_distance_norm: 1000.0  # Fallback normalization if not specified


# Small Grid SOM Configuration for Testing
# Testing if smaller grid (25x25) helps reduce QE and prevent learning rate collapse
#
# Changes from optimized config:
# - Grid size: 50x50 → 25x25 (625 neurons instead of 2500)
# - Initial radius: 16.7 → 8.3 (grid_size/3)
# - Patience: 200 → 100 (smaller grid converges faster)

# Core architecture parameters
architecture_config:
  grid_size: [25, 25]  # SMALLER GRID: 625 neurons for better QE
  topology: 'rectangular'
  spatial_weight: 0.2  # Feature-focused: 80% biodiversity, 20% spatial
  geographic_distance: 'haversine'
  
  # Learning rate settings - same as optimized
  initial_learning_rate: 0.4
  min_learning_rate: 0.01  # Floor to prevent collapse
  max_learning_rate: 1.0
  lr_increase_factor: 1.3
  lr_decrease_factor: 0.90  # Gentle decay
  
  # Adaptive LR ranges
  high_qe_lr_range: [0.5, 1.0]
  low_qe_lr_range: [0.01, 0.8]
  
  # Neighborhood settings - adjusted for 25x25 grid
  neighborhood_function: 'gaussian'
  initial_radius: 8.3  # For 25x25 grid (grid_size/3)
  final_radius: 0.5
  radius_decay: 'linear'
  
  # Convergence criteria
  convergence:
    geographic_coherence_threshold: 0.6
    lr_stability_threshold: 0.1
    qe_improvement_threshold: 0.001
    patience: 100  # Reduced for smaller grid
    max_epochs: 1000

# Distance calculation settings for sparse data
distance_config:
  metric: 'partial_bray_curtis'
  min_valid_features: 1
  missing_value_strategy: 'weighted_ignore'
  
# Training configuration
training_config:
  mode: 'batch'
  parallel_processing: true
  n_cores: 180
  
  # Memory management
  memory_management:
    chunk_if_exceeds: '8GB'
    chunk_size: 25000
    
  # Mini-batch configuration
  minibatch:
    enabled: true
    size: 1000
    
  # Batch processing
  batch_size: 10000
  shuffle_data: true
  
# Preprocessing
preprocessing_config:
  use_advanced: false
  feature_weights: [0.25, 0.25, 0.25, 0.25]  # Equal weights
  transformation: 'log1p'
  normalization: 'minmax'
  clip_outliers: false
  
# Validation settings
validation_config:
  n_folds: 5
  block_size: '500km'
  stratify_by_density: true
  
# Performance settings
performance_config:
  parallel_batch_processing:
    enabled: true
    n_workers: 180
    backend: 'loky'
    min_samples_for_parallel: 25000
    fallback_to_sequential: true
    
  quantization_error:
    use_sampling: true
    qe_sample_size: 50000
    
  progress_tracking:
    enabled: true
    checkpoint_frequency: 10
    
# Spatial metrics configuration  
spatial_metrics:
  k_neighbors: 50
  use_local_morans: true
  weight_by_distance: true
  max_distance_km: 500

# Feature tracking
feature_tracking:
  track_neuron_specialization: true
  track_dead_neurons: true
  prune_dead_neurons: false
  
# Initialization strategy
initialization:
  method: 'pca_plus_noise'
  noise_level: 0.1
  use_data_density: true
# Production SOM Configuration for Sparse Biodiversity Data
# 
# This is the PRODUCTION configuration - use for real analysis runs
# For testing, use som_config_test.yml
#
# Goal: Discover intercorrelations between observed and predicted richness
# - Equal feature weights to find natural patterns
# - Larger grid (60x60) for detailed pattern discovery  
# - Balanced spatial weight (0.2) to maintain geographic coherence
# - Log transformation preserved for richness data distributions

# Data selection and sampling
data_config:
  spatial_grid_step: 1  # PRODUCTION: Use all data points (no sampling)
  feature_cols: ['animal_richness', 'plant_richness', 'fungi_richness']
  coordinate_columns: ['x', 'y']
  observed_columns: [0, 1, 2]  # All three biodiversity columns are observed
  predicted_columns: []  # No predicted columns (biodiversity-only analysis)

# Distance calculation configuration
distance_config:
  input_space: 'bray_curtis'
  missing_data_handling: 'pairwise'
  min_valid_features: 2
  map_space: 'euclidean'

# Data preprocessing
preprocessing_config:
  transformation: 'log1p'
  standardization: 'z_score_by_type'
  missing_data: 'keep_nan'
  use_advanced: false
  spatial_sampling:
    method: 'block_sampling'
    block_size: '750km'
    for_data_at: '100km_resolution'

# SOM architecture  
architecture_config:
  grid_size: [60, 60]  # PRODUCTION: Full 60x60 grid
  grid_type: 'hexagonal'
  initialization: 'pca_transformed'
  distance_metric: 'euclidean'
  topology: 'toroidal'

# Training parameters
training_config:
  max_epochs: 1000  # PRODUCTION: Full training
  batch_size: 10000
  initial_lr: 0.4
  min_lr: 0.01
  lr_schedule: 'vlrsom'
  lr_increase_factor: 1.2
  lr_decrease_factor: 0.85
  initial_radius: 30.0
  min_radius: 1.0
  radius_schedule: 'exponential'
  radius_decay: 0.95
  n_workers: 64  # PRODUCTION: Optimal worker count
  chunk_size: 25000
  update_method: 'chunked_vectorized'
  learning_rule: 'vlrsom'
  qe_window_size: 1
  parallelization:
    enabled: true
    n_jobs: -1
    backend: 'threading'
  weight_normalization: false
  missing_data_strategy: 'partial_update'
  neighborhood_function: 'gaussian'
  spatial_weight: 0.2
  feature_weights: [1.0, 1.0, 1.0]  # Equal weights for biodiversity
  checkpoint_frequency: 100  # Save every 100 epochs

# Validation settings
validation_config:
  n_folds: 5
  validation_split: 0.2
  metrics: ['quantization_error', 'topographic_error', 'geographic_coherence']
  patience: 10
  min_delta: 0.001

# Memory and performance settings
memory_config:
  max_memory_gb: 32  # Maximum memory to use
  chunk_size_adaptive: true  # Automatically adjust chunk size based on memory
  memory_threshold: 0.8  # Start reducing when 80% of max_memory is used

# Early stopping
early_stopping:
  enabled: true
  monitor: 'quantization_error'
  patience: 10
  min_delta: 0.001
  mode: 'min'

# Spatial metrics
spatial_metrics:
  compute_regional_coherence: true
  compute_distance_preservation: true
  compute_spatial_autocorrelation: true

# Output configuration
output_config:
  save_weights: true
  save_activations: true
  save_qe_history: true
  save_checkpoints: true
  checkpoint_dir: 'checkpoints/som'
  output_format: 'npz'

# Logging
logging:
  level: 'INFO'
  log_every_n_epochs: 10
  log_memory_usage: true
  log_timing: true
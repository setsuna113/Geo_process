# Optimized SOM Configuration for Sparse Biodiversity Data
# Based on analysis of current results and research findings
#
# Goal: Discover intercorrelations between observed and predicted richness
# - Equal feature weights to find natural patterns
# - Larger grid (50x50) for detailed pattern discovery  
# - Balanced spatial weight (0.4) to maintain geographic coherence
# - Log transformation preserved for richness data distributions

# Core architecture parameters
architecture_config:
  grid_size: [50, 50]  # 2,500 neurons for detailed pattern discovery
  topology: 'rectangular'  # Using rectangular as hexagonal not implemented yet
  spatial_weight: 0.4  # Balanced: 60% biodiversity, 40% spatial
  geographic_distance: 'haversine'
  
  # Learning rate settings - more aggressive start, slower decay
  initial_learning_rate: 0.8  # Increased from 0.5
  min_learning_rate: 0.001  # Decreased from 0.01
  max_learning_rate: 1.0
  lr_increase_factor: 1.3  # More aggressive increase
  lr_decrease_factor: 0.85  # Slower decay
  
  # Adaptive LR ranges - wider ranges for better adaptation
  high_qe_lr_range: [0.5, 1.0]  # Was [0.3, 0.8]
  low_qe_lr_range: [0.001, 0.05]  # Was [0.01, 0.1]
  
  # Neighborhood settings - adjusted for 50x50 grid
  neighborhood_function: 'gaussian'
  initial_radius: 16.7  # For 50x50 grid (grid_size/3)
  final_radius: 0.5  # Smaller than 1.0 for finer distinctions
  radius_decay: 'exponential'  # Better for sparse data - fast initial, slow later
  
  # Convergence criteria - adjusted for sparse data
  convergence:
    geographic_coherence_threshold: 0.3  # Lowered from 0.6 (realistic for sparse data)
    lr_stability_threshold: 0.1  # Increased from 0.05
    qe_improvement_threshold: 0.001  # More sensitive (was 0.005)
    patience: 200  # Increased for 50x50 grid
    max_epochs: 1000  # Increased for larger grid convergence

# Distance calculation settings for sparse data
distance_config:
  metric: 'partial_bray_curtis'
  min_valid_features: 1  # Decreased from 2 for very sparse data
  missing_value_strategy: 'weighted_ignore'  # Weight by available features
  
# Training configuration
training_config:
  mode: 'batch'
  parallel_processing: true
  n_cores: 32  # Keep as optimized
  
  # Memory management
  memory_management:
    chunk_if_exceeds: '8GB'
    chunk_size: 100000  # Increased from 50000
    
  # Batch processing
  batch_size: 10000  # For smoother updates
  shuffle_data: true  # Important for sparse data
  
# Preprocessing - critical for sparse data
preprocessing_config:
  # Feature weighting - EQUAL for finding intercorrelations
  feature_weights: [0.25, 0.25, 0.25, 0.25]  # Equal weights to discover natural correlations
  
  # Normalization - keep log transformation!
  transformation: 'log1p'  # Essential for richness data
  normalization: 'minmax'  # After log, scale to [0,1]
  clip_outliers: false  # Don't clip - we want to see hotspots
  
# Validation settings
validation_config:
  n_folds: 5  # Increased from 3 for better assessment
  block_size: '500km'  # Smaller blocks for finer spatial resolution
  stratify_by_density: true  # Ensure sparse regions are represented
  
# Performance settings
performance_config:
  parallel_batch_processing:
    enabled: true
    n_workers: 32
    backend: 'loky'
    min_samples_for_parallel: 100000  # Minimum samples to trigger parallel processing
    fallback_to_sequential: true  # Use sequential if parallel fails
    
  quantization_error:
    use_sampling: true
    qe_sample_size: 50000  # Increased from 10000
    
  progress_tracking:
    enabled: true
    checkpoint_frequency: 10  # Every 10 epochs
    
# Spatial metrics configuration  
spatial_metrics:
  k_neighbors: 50  # Increased from 30 for sparse data
  use_local_morans: true  # Calculate local Moran's I
  weight_by_distance: true
  max_distance_km: 500  # Limit spatial influence

# Note: We do NOT use sample weighting!
# All regions are equally important for discovering richness patterns
# The spatial_weight parameter (0.4) already handles geographic coherence

# Feature importance tracking
feature_tracking:
  track_neuron_specialization: true
  track_dead_neurons: true  # Important for sparse data
  prune_dead_neurons: false  # Keep for analysis
  
# Initialization strategy
initialization:
  method: 'pca_plus_noise'  # Better than pure PCA for sparse data
  noise_level: 0.1
  use_data_density: true  # Initialize more neurons in dense regions
# Optimized SOM Configuration for Sparse Biodiversity Data
# Based on analysis of current results and research findings
#
# Goal: Discover intercorrelations between observed and predicted richness
# - Equal feature weights to find natural patterns
# - Larger grid (50x50) for detailed pattern discovery  
# - Balanced spatial weight (0.4) to maintain geographic coherence
# - Log transformation preserved for richness data distributions

# Core architecture parameters
architecture_config:
  grid_size: [60, 60]  # 3600 neurons for better representation of 9M+ samples
  topology: 'rectangular'  # Using rectangular as hexagonal not implemented yet
  spatial_weight: 0.2  # 20% spatial, 80% biodiversity (as per user request)
  geographic_distance: 'haversine'
  
  # Learning rate settings - moderate start for stability
  initial_learning_rate: 0.4  # Reduced from 0.8 for better stability with sparse data
  min_learning_rate: 0.1  # Floor at 0.1 as requested (was 0.05)
  max_learning_rate: 1.0
  lr_increase_factor: 1.3  # More aggressive increase
  lr_decrease_factor: 0.90  # GENTLER decay to prevent rapid collapse (was 0.85)
  
  # Adaptive LR ranges - wider ranges for better adaptation
  high_qe_lr_range: [0.5, 1.0]  # For QE > 0.5
  low_qe_lr_range: [0.1, 0.8]  # For QE < 0.02 - MIN matches floor of 0.1
  
  # Neighborhood settings - adjusted for 60x60 grid
  neighborhood_function: 'gaussian'
  initial_radius: 20.0  # For 60x60 grid (grid_size/3)
  final_radius: 0.5  # Smaller than 1.0 for finer distinctions
  radius_decay: 'linear'  # More predictable decay for better stability
  
  # Topographic error based radius adjustment
  te_radius_adjustment: true  # Enable TE-based radius adjustment
  te_high_threshold: 0.15  # TE > 0.15 is considered high
  te_low_threshold: 0.05   # TE < 0.05 is considered low
  te_high_radius_modifier: 1.1  # Slow down radius decay by 10% for high TE
  te_low_radius_modifier: 0.95  # Speed up radius decay by 5% for low TE
  
  # Convergence criteria - adjusted for sparse data
  convergence:
    geographic_coherence_threshold: 0.6  # Raised back to ensure meaningful geographic organization
    lr_stability_threshold: 0.1  # Increased from 0.05
    qe_improvement_threshold: 0.001  # More sensitive (was 0.005)
    qe_stability_window: 20  # Check QE range over last 20 epochs
    qe_stability_threshold: 0.001  # Consider converged if QE range < 0.1%
    patience: 200  # Increased for 50x50 grid
    max_epochs: 1000  # Increased for larger grid convergence

# Distance calculation settings for sparse data
distance_config:
  metric: 'partial_bray_curtis'
  min_valid_features: 1  # Decreased from 2 for very sparse data
  missing_value_strategy: 'weighted_ignore'  # Weight by available features
  
# Training configuration
training_config:
  mode: 'batch'
  parallel_processing: true
  n_cores: 80  # Conservative for workday usage (was 180)
  
  # Memory management
  memory_management:
    chunk_if_exceeds: '8GB'
    chunk_size: 25000  # Back to reasonable chunk size with mini-batching
    
  # Mini-batch configuration
  minibatch:
    enabled: true
    size: 1000  # Process 1000 samples at a time within each chunk
    # Memory usage: 1000 × 2500 × 4 × 8 bytes = 80MB per mini-batch
    
  # Batch processing
  batch_size: 10000  # For smoother updates
  shuffle_data: true  # Important for sparse data
  
# Preprocessing - critical for sparse data
preprocessing_config:
  # Enable advanced preprocessing with spatial features
  use_advanced: false  # DISABLED: These methods are for supervised prediction, not unsupervised discovery
  
  # Feature weighting - EQUAL for finding intercorrelations
  feature_weights: [0.25, 0.25, 0.25, 0.25]  # Equal weights to discover natural correlations
  
  # Basic preprocessing (when use_advanced=false)
  # IMPORTANT: We use simple preprocessing for unsupervised discovery
  # Advanced spatial features would impose structure we want SOM to discover naturally
  transformation: 'log1p'  # Essential for richness data (handles zeros well)
  normalization: 'minmax'  # After log, scale to [0,1]
  clip_outliers: false  # Don't clip - we want to see hotspots
  
  # Advanced preprocessing options (when use_advanced=true)
  # Zero-inflation handling
  structural_zero_threshold: 0.95  # 95% zeros are considered structural
  pseudo_count_method: 'adaptive'  # Adaptive pseudo-counts based on data
  compositional_transform: 'hurdle'  # CRITICAL: Use 'hurdle' NOT 'clr' for species richness counts
  
  # Spatial feature engineering - REDUCED COMPLEXITY based on evidence
  spatial_neighbors: 8  # Number of nearest neighbors for spatial features
  spatial_scales: [10, 50, 100]  # Reduced from 5 to 3 scales to avoid feature explosion with sparse data
  n_moran_eigenvectors: 10  # Number of spatial eigenvectors (reduced from 20)
  use_pmem: true  # Use predictive MEM for better spatial patterns
  
# Validation settings
validation_config:
  n_folds: 1  # Use all data for training (no CV splits)
  block_size: '500km'  # Not used when n_folds=1
  stratify_by_density: true  # Not used when n_folds=1
  
# Performance settings
performance_config:
  parallel_batch_processing:
    enabled: true
    n_workers: 80  # Match n_cores for consistency
    backend: 'loky'
    min_samples_for_parallel: 25000  # Match chunk size
    fallback_to_sequential: true  # Use sequential if parallel fails
    
  quantization_error:
    use_sampling: true
    qe_sample_size: 50000  # Increased from 10000
    
  progress_tracking:
    enabled: true
    checkpoint_frequency: 10  # Every 10 epochs
    checkpoint_dir: 'checkpoints/som'  # Directory for checkpoints
    
# Spatial metrics configuration  
spatial_metrics:
  k_neighbors: 50  # Increased from 30 for sparse data
  use_local_morans: true  # Calculate local Moran's I
  weight_by_distance: true
  max_distance_km: 500  # Limit spatial influence

# Note: We do NOT use sample weighting!
# All regions are equally important for discovering richness patterns
# The spatial_weight parameter (0.4) already handles geographic coherence

# Feature importance tracking
feature_tracking:
  track_neuron_specialization: true
  track_dead_neurons: true  # Important for sparse data
  prune_dead_neurons: false  # Keep for analysis
  
# Initialization strategy
initialization:
  method: 'pca_plus_noise'  # Better than pure PCA for sparse data
  noise_level: 0.1
  use_data_density: true  # Initialize more neurons in dense regions
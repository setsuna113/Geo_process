# Unified SOM Configuration for Sparse Biodiversity Data
# 
# DEFAULT CONFIGURATION - Automatically selects based on environment:
# - Production: som_config_production.yml (full data, 1000 epochs)
# - Test: som_config_test.yml (sampled data, 15 epochs)
#
# To override: Set SOM_CONFIG_MODE environment variable to 'test' or 'production'
# Or use specific config file with SOM_CONFIG_PATH
#
# This file contains shared defaults used by both test and production configs

# Data selection and sampling (DEFAULT - will be overridden)
data_config:
  spatial_grid_step: 4  # 4x sampling as requested (every 4th point)
  feature_cols: ['plants_richness', 'terrestrial_richness', 'am_fungi_richness', 'ecm_fungi_richness']  # All 4 biodiversity columns
  coordinate_columns: ['x', 'y']  # Column names for coordinates
  observed_columns: [0, 1, 2, 3]  # All four biodiversity columns are observed
  predicted_columns: []  # No predicted columns (biodiversity-only analysis)

# Distance calculation configuration
distance_config:
  input_space: 'bray_curtis'
  missing_data_handling: 'pairwise'
  min_valid_features: 2
  map_space: 'euclidean'

# Data preprocessing
preprocessing_config:
  transformation: 'log1p'
  standardization: 'z_score_by_type'
  missing_data: 'keep_nan'
  use_advanced: false  # Set to true to enable advanced preprocessing
  spatial_sampling:
    method: 'block_sampling'
    block_size: '750km'
    for_data_at: '100km_resolution'

# Core architecture parameters (ONLY structure, no training params)
architecture_config:
  type: 'GeoSOM_VLRSOM'
  grid_size: [50, 50]  # Production quality grid for detailed analysis
  topology: 'rectangular'  # Using rectangular as hexagonal not implemented yet
  spatial_weight: 0.2  # 20% spatial, 80% biodiversity
  geographic_distance: 'haversine'
  combine_distances: 'weighted_sum'
  max_grid_neurons_warning: 10000  # Warn if grid_size[0] * grid_size[1] exceeds this
  
  # Neighborhood settings (structural, not training)
  neighborhood_function: 'gaussian'
  initial_radius: 20.0  # For 60x60 grid (grid_size/3)
  final_radius: 0.5  # Smaller than 1.0 for finer distinctions
  radius_decay: 'linear'  # More predictable decay for better stability

# Training parameters (ALL training-related settings here)
training_config:
  max_epochs: 100  # THE ONLY max_epochs - production run to 100 epochs
  chunk_size: 25000  # THE ONLY chunk_size for training
  n_workers: 20  # Production run with good parallelization
  use_minibatch: true  # Enable mini-batch processing for memory efficiency
  minibatch_size: 1000  # Process 1000 samples at a time within chunks
  
  # Learning rate settings (moved from architecture_config)
  initial_learning_rate: 0.4  # Reduced from 0.8 for better stability with sparse data
  min_learning_rate: 0.1  # Floor at 0.1 (was 0.05)
  max_learning_rate: 1.0
  lr_increase_factor: 1.3  # More aggressive increase
  lr_decrease_factor: 0.90  # GENTLER decay to prevent rapid collapse (was 0.85)
  
  # Adaptive LR ranges (moved from architecture_config)
  high_qe_lr_range: [0.5, 1.0]  # For QE > 0.5
  low_qe_lr_range: [0.1, 0.8]  # For QE < 0.02 - MIN matches floor of 0.1
  
  # Convergence criteria (moved from architecture_config.convergence)
  patience: 50  # Epochs without improvement
  geographic_coherence_threshold: 0.6  # Ensure meaningful geographic organization
  geographic_coherence_weight: 0.3  # Weight for geographic coherence in convergence
  lr_stability_threshold: 0.1  # Increased from 0.05
  lr_stability_window: 3  # Check over 3 epochs
  early_convergence_epochs: 200  # Consider converged after 200 epochs
  qe_improvement_threshold: 0.001  # < 0.1% improvement
  
  # Topographic error based radius adjustment (training behavior)
  te_radius_adjustment: true  # Enable TE-based radius adjustment
  te_high_threshold: 0.15  # TE > 0.15 is considered high
  te_low_threshold: 0.05   # TE < 0.05 is considered low
  te_high_radius_modifier: 1.1  # Slow down radius decay by 10% for high TE
  te_low_radius_modifier: 0.95  # Speed up radius decay by 5% for low TE
  
  # Adaptive learning rate thresholds
  lr_recovery_threshold: 0.02  # Trigger recovery when LR drops below this
  qe_poor_threshold: 0.055  # Consider QE poor above this value
  lr_recovery_target: 0.05  # Target LR after recovery
  
  # Improvement thresholds for LR adaptation
  significant_improvement: 0.05  # >5% improvement
  small_improvement: 0.01  # 1-5% improvement  
  small_degradation: -0.02  # 0-2% degradation (noise)
  moderate_degradation: -0.05  # 2-5% degradation
  small_increase_factor: 1.02  # Factor for small LR increase
  gentle_decrease_factor: 0.98  # Factor for gentle LR decrease
  
  # QE region thresholds
  high_qe_threshold: 0.5  # QE above this indicates poor performance
  low_qe_threshold: 0.02  # QE below this indicates excellent performance

# Validation settings
validation_config:
  cv_folds: 0  # Set to 0 to disable CV for exploration mode - use full dataset
  test_size_ratio: 0.2
  
  quantization_error:
    use_sampling: true
    qe_sample_size: 50000  # Increased from 10000
    
  progress_tracking:
    enabled: true
    checkpoint_frequency: 10  # Save checkpoint at epoch 10
    checkpoint_dir: 'checkpoints/som'  # Directory for checkpoints
    qe_sample_frequency: 10  # Calculate QE on larger sample every N epochs
    te_calculation_frequency: 10  # Calculate topographic error every N epochs
    geographic_coherence_frequency: 10  # Calculate geographic coherence every N epochs
    large_sample_size: 50000  # Sample size for accurate QE calculation
    quick_sample_divisor: 10  # Divide data size by this for quick samples

# Sampling configuration for parallelization
sampling_config:
  n_samples_for_sampling: 100000  # High threshold due to sparse data
  # Note: chunk_size is defined in training_config (25000)

# Memory and performance settings
memory_config:
  max_memory_gb: 32  # Maximum memory to use
  chunk_size_adaptive: true  # Automatically adjust chunk size based on memory
  memory_threshold: 0.8  # Start reducing when 80% of max_memory is used
  qe_calc_chunk_size: 1000  # Chunk size for QE calculation
  prediction_chunk_size: 5000  # Chunk size for prediction
  vectorized_threshold: 1000  # Use vectorized ops above this sample count

# Early stopping configuration (uses patience from training_config)
early_stopping:
  enabled: true
  min_delta: 0.0001  # Smaller delta for sparse data (0.01% improvement)
  restore_best_weights: true
  # Note: patience is defined in training_config (50 epochs)

# Spatial metrics configuration  
spatial_metrics:
  k_neighbors: 50  # Increased from 30 for sparse data
  use_local_morans: true  # Calculate local Moran's I
  weight_by_distance: true
  max_distance_km: 500  # Limit spatial influence
  coherence_sample_threshold: 10000  # Sample when dataset exceeds this
  coherence_sample_size: 5000  # Sample size for coherence calculation

# Output configuration
output_config:
  save_interval: 100
  save_intermediate_maps: false
  visualize_every_n_epochs: 100
  save_component_maps: true
  save_qe_history: true
  save_training_animation: false
  
# Logging
logging:
  level: 'INFO'
  log_training_progress: true
  log_epoch_details: true
  log_convergence_metrics: true
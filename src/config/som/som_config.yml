# GeoSOM + VLRSOM Configuration File
# Optimized for biodiversity data with 70% missing values
# 
# This configuration file allows easy tuning of all SOM parameters
# without modifying the source code

# Data selection and sampling
data_config:
  spatial_grid_step: 100  # Take every 100th point in spatial grid (~18k rows for testing)
  feature_cols: ['animal_richness', 'plant_richness', 'fungi_richness']  # All biodiversity columns
  coordinate_columns: ['x', 'y']  # Column names for coordinates
  observed_columns: [0, 1, 2]  # All three biodiversity columns are observed
  predicted_columns: []  # No predicted columns (biodiversity-only analysis)

# Distance calculation configuration
distance_config:
  input_space: 'bray_curtis'
  missing_data_handling: 'pairwise'
  min_valid_features: 2
  map_space: 'euclidean'

# Data preprocessing
preprocessing_config:
  transformation: 'log1p'
  standardization: 'z_score_by_type'
  missing_data: 'keep_nan'
  spatial_sampling:
    method: 'block_sampling'
    block_size: '750km'
    for_data_at: '100km_resolution'

# GeoSOM + VLRSOM architecture
architecture_config:
  type: 'GeoSOM_VLRSOM'
  
  # Spatial integration
  spatial_weight: 0.3  # 30% spatial, 70% features
  geographic_distance: 'haversine'
  combine_distances: 'weighted_sum'
  
  # Grid configuration
  topology: 'rectangular'
  grid_size: [10, 10]  # Small grid for testing (100 neurons)
  
  # Learning rate - VLRSOM adaptive configuration
  initial_learning_rate: 0.3      # Moderate start (was 0.5 - too high with small radius)
  min_learning_rate: 0.01         # Higher floor to maintain learning (was 0.001)
  max_learning_rate: 0.5          # Reasonable max (was 0.8)
  lr_increase_factor: 1.02        # Very gentle increases (was 1.05)
  lr_decrease_factor: 0.98        # Much gentler decreases (was 0.90 - too aggressive)
  
  # Adaptive learning rate regions
  high_qe_lr_range: [0.3, 0.6]    # Moderate range for high error regions
  low_qe_lr_range: [0.001, 0.05]  # Very low for stability in low error regions
  
  # Neighborhood function
  neighborhood_function: 'gaussian'
  initial_radius: 3.0  # Small radius for 10x10 grid
  final_radius: 0.5    # Smaller final radius for fine-tuning (was 1.0)
  radius_decay: 'linear'  # Simple linear decay for testing
  
  # Convergence criteria
  convergence:
    geographic_coherence_threshold: 0.6   # Moran's I threshold (lowered from 0.7)
    lr_stability_threshold: 0.05          # Allow more LR variation (was 0.02)
    qe_improvement_threshold: 0.005       # 0.5% improvement (was 0.001)
    patience: 100                         # Epochs without improvement (increased from 20)
    max_epochs: 15                        # Just enough to test checkpoint at epoch 10

# Training configuration
training_config:
  mode: 'batch'
  parallel_processing: true
  n_cores: 10  # Minimal cores for testing
  memory_management:
    chunk_if_exceeds: '100GB'  # We have 800GB free
    chunk_size: 1000  # Very small chunks for minimal memory
  
  # Parallel processing configuration
  parallel:
    enabled: true  # Use parallel chunk processing
    n_workers: 10  # Minimal workers for testing
    min_samples_for_parallel: 100000  # Only parallelize for datasets larger than this

# Validation configuration
validation_config:
  method: 'spatial_block_cv'
  n_folds: 0  # Set to 0 to disable CV and train on all data
  block_size: '750km'
  stratification: 'ensure_all_biodiversity_types'
  metrics:
    - 'quantization_error'
    - 'topographic_error'
    - 'geographic_coherence'
    - 'beta_diversity_preservation'

# Sampling configuration for large datasets
sampling_config:
  qe_calculation:
    sample_size: 100000      # Larger samples for accurate QE
    full_qe_frequency: 5     # Calculate full QE every N epochs
  geographic_coherence:
    sample_size: 5000        # For O(n²) Moran's I calculation
    calculation_frequency: 10  # Every N epochs

# Early stopping configuration
early_stopping:
  enabled: true
  criteria:
    - metric: 'qe_plateau'
      threshold: 0.005        # Stop if QE changes < 0.5%
      patience: 10            # For 10 consecutive epochs
    - metric: 'geographic_coherence'
      threshold: 0.6          # Stop if Moran's I > 0.6
    - metric: 'learning_rate'
      threshold: 0.005        # Stop if LR < 0.005
    - metric: 'radius'
      threshold: 1.5          # Stop if radius < 1.5

# Output configuration
output_config:
  save_checkpoints: true
  checkpoint_frequency: 10    # Save every N epochs
  save_training_history: true
  save_weights: true
  save_cluster_assignments: true
  save_visualizations: true

# Logging configuration
logging:
  level: 'INFO'
  log_batch_progress: true
  log_frequency: 20  # Log every N chunks during batch update
  log_convergence_details: true
# K-means Hierarchical Configuration
# This file contains ONLY method-specific settings
# Input paths and experiment names should be in config.yml

# Method parameters
method_params:
  # Two-stage clustering parameters
  n_pre_clusters: 5000  # Default if elbow method is disabled
  use_elbow_method: true  # Use elbow method to find optimal k
  k_range: [1000, 10000]  # Range to test for elbow method
  elbow_threshold: 0.01  # Stop when improvement < 1%
  
  # Clustering approach (automatically sets linkage and distance)
  # 'ecological' → Average + Bray-Curtis (for biodiversity gradients)
  # 'geometric'  → Ward + Euclidean (for compact clusters)
  clustering_approach: geometric  # BEST for biodiversity hotspots
  
  # Final cluster selection
  final_k: null  # Let bootstrap determine
  final_k_range: [6, 20]
  selection_method: bootstrap
  n_bootstrap: 100
  bootstrap_sample_ratio: 0.8
  
  # Performance
  use_minibatch: true
  batch_size: 50000  # Larger batches for better k-means quality
  n_jobs: -1
  chunk_size: 50000

# Data processing
data_processing:
  handle_missing: complete_cases
  normalization: robust
  remove_outliers: false
  min_features_prefilter: 1
  spatial_grid_step: 2  # Sample every 2nd point (~13M) - best quality within memory limits
  selected_features: ['animal_richness', 'plant_richness', 'am_fungi_richness', 'ecm_fungi_richness']

# Visualization
visualization:
  generate_dendrogram: true
  generate_geographic_maps: true
  generate_3d_visualization: true
  generate_validation_plots: true
  n_samples_for_viz: 500000
  calculate_silhouette: true
  silhouette_sample_size: 100000

# Memory management
performance:
  large_dataset_threshold: 1000000
  memory_chunk_size: 50000
  max_memory_gb: 32
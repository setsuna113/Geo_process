# CP-WOPT (Tensor Factorization) Configuration
# For sparse biodiversity tensor decomposition

# Data processing configuration
data_processing:
  data_path: 'data/merged/biodiversity_climate_1x_production.parquet'  # 1.7GB file with 51.9M points
  spatial_grid_step: 1       # Use ALL points - RTX 4090 can handle it!
  random_seed: 42            # Random seed for reproducibility
  coordinate_cols: ['x', 'y'] # Explicit coordinate columns
  # Use 4 biodiversity bands (can add climate bands if needed)
  feature_cols: ['animal_richness', 'plant_richness', 'am_fungi_richness', 'ecm_fungi_richness']

# Algorithm parameters
algorithm:
  rank: 'auto'                # Auto-select optimal rank (likely 4-6 based on research)
  max_iterations: 1000        # Maximum ALS iterations
  convergence_threshold: 1e-6 # Relative error threshold
  init_method: 'nndsvd'       # Non-negative Double SVD - better for sparse non-negative data
  optimizer: 'als'            # Optimizer: 'als' is most stable for large-scale
  random_state: 42            # For reproducibility
  learning_rate: 0.01         # Learning rate for SGD methods
  momentum: 0.9               # Momentum parameter for SGD with momentum

# Rank selection parameters (when rank='auto')
rank_selection:
  method: 'elbow'             # Selection method: 'elbow', 'cross_validation', 'core_consistency'
  min_rank: 3                 # Climate + geographic structure + evolutionary (based on research)
  max_rank: 8                 # Conservative upper bound for 4 biodiversity features
  n_trials: 3                 # Number of trials per rank for stability
  plot: true                  # Generate diagnostic plot

# Tensor construction parameters
tensor_construction:
  # NO GRIDDING - data is used at native resolution directly from parquet!
  # Shape determined automatically from unique x,y coordinates in data
  transform: 'log1p'         # Transform: 'none', 'log1p', 'sqrt', 'asinh'
  min_observations: 1        # Minimum observations per cell (not used for direct conversion)
  fill_value: 0              # Value for empty/missing cells

# Weight mask configuration
weights:
  missing_value_weight: 0.0   # Weight for missing values
  use_observation_counts: false # No aggregation - each point is unique
  min_weight: 0.0             # Minimum weight threshold
  max_weight: 1.0             # Maximum weight (for normalization)

# MiniBatch removed - HiCOO handles memory-efficient block processing internally
# HiCOO processes tensor in 128x128x128 spatial blocks for optimal cache locality

# Sparse tensor handling
sparse:
  auto_sparse: true          # Automatically use sparse format
  sparsity_threshold: 0.5    # Use sparse above 50% (data is 69% sparse)
  force_sparse: true         # Always use sparse - data is 69% sparse
  storage_format: 'hicoo'    # Sparse format: HiCOO only (6.8x faster MTTKRP)

# Factor constraints
constraints:
  nonnegative: true          # Non-negative for species richness data
  orthogonal: false          # Orthogonal factors
  sparsity: 0.0             # L1 sparsity (0-1)
  smoothness: 0.0           # Spatial smoothness regularization

# Advanced optimization
optimization:
  learning_rate: 0.01       # For gradient methods
  momentum: 0.9             # Momentum parameter
  gradient_iterations: 10   # Inner gradient steps
  line_search: true         # Use line search
  regularization: 1e-4      # Small L2 regularization for stability

# Component interpretation
interpretation:
  top_n_features: 10        # Top features per component
  significance_threshold: 0.1 # Minimum loading significance
  sort_components: true     # Sort by variance explained
  normalize_loadings: true  # Normalize factor loadings

# Memory management
memory:
  max_tensor_gb: 20.0        # Conservative for RTX 4090's 24GB VRAM
  chunk_memory_fraction: 0.9 # Can use more with dedicated GPU memory
  enable_checkpointing: true # Save intermediate results
  checkpoint_interval: 50    # Checkpoint frequency

# Parallel processing
parallel:
  n_workers: 32             # Number of workers (match actual system cores)
  backend: 'multiprocessing' # Joblib backend: 'threading', 'multiprocessing' (better for CPU-bound)
  batch_parallelism: true   # Parallelize across batches
  factor_parallelism: false # Parallelize factor updates (disabled to reduce overhead)

# Convergence monitoring
convergence:
  patience: 20              # More patience for large dataset
  min_improvement: 1e-5     # Tighter improvement threshold
  check_interval: 10        # Check convergence every N iterations
  early_stopping: true      # Enable early stopping

# Output configuration
output:
  save_factors: true        # Save factor matrices
  save_metrics: true        # Save quality metrics
  save_reconstructed: false # Save reconstructed tensor
  compression: 'gzip'       # Compression for saved files
  decimal_places: 6         # Precision for saved values

# Validation
validation:
  cross_validation: false   # Enable cross-validation
  n_folds: 5               # Number of CV folds
  validation_fraction: 0.1  # Fraction for validation
  stability_runs: 3        # Runs for stability assessment

# Reporting
reporting:
  generate_plots: true      # Generate visualization plots
  plot_components: 10       # Plot all 10 components
  plot_format: 'png'        # Plot format: 'png', 'pdf', 'svg'
  plot_dpi: 300            # Plot resolution (higher quality)
  colormap: 'viridis'      # Colormap for visualizations
  
  # Biome visualization parameters
  smoothing_sigma: 1.5      # Gaussian smoothing (0 = no smoothing)
  threshold_percentile: 30  # Remove bottom 30% of weak signals
  min_component_weight: 0.05 # Minimum component weight to display

# Backend configuration
backend:
  use_gpu: 'gpu'           # Force GPU - we have RTX 4090 with 24GB!

# SAMPLING REMOVED - Use only spatial_grid_step in data_processing
# Leverage sampling impossible (needs decomposition first - circular dependency)
# Density/uniform sampling redundant with spatial_grid_step

# Logging
logging:
  level: 'INFO'            # Logging level
  progress_bar: true       # Show progress bar
  log_memory: true         # Log memory usage
  log_timing: true         # Log timing information
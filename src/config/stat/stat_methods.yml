# Statistical Analysis Configuration
# Single unified configuration for biodiversity statistical methods

# Method enable/disable settings
methods:
  coverage:
    enabled: true
    skip_reason: "Enable for production run"
    sample_factor: 5  # Production: 5, Test: 20
    
  trust_maps:
    enabled: true
    sample_factor: 5  # Production: 5, Test: 20
    
  overlap:
    enabled: true
    skip_reason: "Enable for production run"
    sample_factor: 5  # Production: 5, Test: 20
    
  latitudinal:
    enabled: true
    sample_factor: 5  # Already optimized
    
  global_maps:
    enabled: true
    sample_factor: 5  # Production: 5, Test: 20
    
  correlation:
    enabled: true
    sample_factor: 5  # Production: 5, Test: 20
    
  biome_analysis:
    enabled: true
    chunk_size: 100000  # Sample size for large datasets
    sample_factor: 5

# Dataset paths
datasets:
  plants: "data/richness_maps/daru-plants-richness.tif"
  animals: "data/richness_maps/iucn-terrestrial-richness.tif"
  am_fungi: "data/fungal/spun/AM_fungi/AM_Fungi_Richness_Predicted.tif"
  ecm_fungi: "data/fungal/spun/EcM_fungi/EcM_Fungi_Richness_Predicted.tif"
  
  # Climate data with elevation for biome analysis
  climate_parquet: "biodiversity_climate_production_1x_corrected.parquet"

# Global settings
settings:
  output_dir: "outputs/biodiversity_analysis"
  log_level: "INFO"
  log_file: "biodiversity_analysis.log"
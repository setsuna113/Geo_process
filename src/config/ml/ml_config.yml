# ML Configuration File
regression_analysis:
  preprocessing:
    drop_na: true
    scale_features: false
  
  data:
    spatial_grid_step: 1

# Method 1 specific configuration
method1:
  response: "fungi"
  log_biodiversity: true  # If true, log-transform biodiversity predictors before standardization

# Ridge regression configuration for GLM models
ridge:
  enabled: false  # Disabled - not effective with 4.3M observations
  # Ridge faces fundamental scaling issues with big data:
  # - Lambda for good prediction: ~100-1000
  # - Lambda for meaningful shrinkage: ~1,000,000+
  # - These objectives are incompatible at this scale
  # Standard GLM performs better with large samples

# Negative Binomial GLM configuration
negbin:
  # Fixed theta for fair model comparison
  # Using median of observed thetas (22.10, 25.55, 27.89, 25.16) = 25.35
  # This ensures all models have the same null log-likelihood baseline
  # making pseudo R² values directly comparable
  # fixed_theta: 25.35  # COMMENTED OUT - estimate theta for each model
  # Set to null or remove to estimate theta for each model
    
  models:
    family: "negative_binomial"
    theta_estimation: "ml"
    target_column: "fungi_richness_log"
    feature_columns:
      - "bio01_mean"
      - "bio12_annual"
      - "plants_richness_log"
      - "vertebrates_richness_log"
    
    lightgbm:
      outcome_model:
        objective: "regression"
        metric: "rmse"
        num_leaves: 31
        max_depth: 6
        learning_rate: 0.1
        feature_fraction: 0.9
        bagging_fraction: 0.5
        bagging_freq: 1
        min_data_in_leaf: 100
        num_threads: 120  # Using 120 threads (system has 256 cores)
        num_iterations: 100
        seed: 42
        force_col_wise: true
        verbosity: -1
      
      treatment_model:
        objective: "regression"
        metric: "rmse"
        num_leaves: 31
        max_depth: 6
        learning_rate: 0.1
        feature_fraction: 0.9
        bagging_fraction: 0.5
        bagging_freq: 1
        min_data_in_leaf: 100
        num_threads: 80  # Same as outcome model
        num_iterations: 100
        seed: 42
        force_col_wise: true
        verbosity: -1
    
  hypothesis_testing:
    alpha: 0.05
    sesoi_threshold: 0.1
    tost_bounds: [-0.05, 0.05]
    
  output:
    results_dir: "results"
    figures_dir: "results/figures"
    reports_dir: "results/reports"
    julia_results_dir: "/scratch/yl998/julia"

# LMG Importance Analysis Configuration
lmg_model: "method1"  # Model to use for preprocessing: method1 or method2
lmg_data_path: "/maps-priv/jacob/gaia_data/integrated_richness_v3.arrow"  # Data source
lmg_response: "fungi"
lmg_spatial_step: 1000  # Spatial subsampling step
lmg_n_samples: 100000  # Number of samples for analysis
lmg_n_workers: 100  # Number of parallel workers
lmg_fixed_theta: 18.83  # Fixed theta for negative binomial
lmg_max_orderings: 1000  # Maximum number of orderings to sample
lmg_output_dir: "/scratch/yl998/lmg_results"  # Output directory

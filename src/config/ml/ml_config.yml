# ML Configuration File
regression_analysis:
  preprocessing:
    drop_na: true
    scale_features: false
  
  data:
    spatial_grid_step: 1
    
  models:
    family: "negative_binomial"
    theta_estimation: "ml"
    target_column: "fungi_richness_log"
    feature_columns:
      - "bio01_mean"
      - "bio12_annual"
      - "plants_richness_log"
      - "vertebrates_richness_log"
    
  hypothesis_testing:
    alpha: 0.05
    sesoi_threshold: 0.1
    tost_bounds: [-0.05, 0.05]
    
  output:
    results_dir: "results"
    figures_dir: "results/figures"
    reports_dir: "results/reports"

# =============================================================================
# EconML Pipeline Configuration - OPTIMIZED FOR 5M SAMPLES
# =============================================================================
# Based on the debugged version with min_impurity_decrease REMOVED
# and parameters optimized for large-scale data

# =============================================================================
# SECTION 0: SHARED PARAMETERS
# =============================================================================
num_threads: 80           # Master thread control
cv_folds: 3              # Reduced from 5 for faster training with 5M samples
random_state: 42         # Random seed for reproducibility
alpha: 0.05              # Statistical significance level

# =============================================================================
# SECTION 1: DATA & PATHS
# =============================================================================

# ---------- Paths ----------
data_path: "/scratch/yl998/biodiversity_climate_production_1x_corrected.arrow"  # Original data file
mesf_cache_dir: "/scratch/yl998/.cache/mesf"
output_dir: "/scratch/yl998/econml_results_5m"

# ---------- Data Processing ----------
spatial_step: 10        # Sample every 10th point for faster processing

# ---------- Variable Definitions (unchanged) ----------
outcome: "fungi_richness"

treatments:
  - "plants_richness"
  - "vertebrates_richness"
  - "plants_x_vertebrates"

effect_modifiers:
  - "bio01_std"          # Mean annual temperature
  - "bio04_std"          # Temperature seasonality
  - "bio12_std"          # Annual precipitation

climate_confounders:
  - "bio01_std"
  - "bio04_std"
  - "bio12_std"
  - "bio15_std"

topographic_confounders:
  - "elevation_std"
  - "slope_std"
  - "aspect_cos_std"
  - "aspect_sin_std"
  - "tpi_std"

soil_confounders:
  - "soil_ph_std"
  - "soil_organic_carbon_std"
  - "sand_content_pct_std"

water_balance_confounders:
  - "pet_mm_month_std"

# =============================================================================
# SECTION 2: ESTIMATOR PARAMETERS - OPTIMIZED FOR 5M
# =============================================================================

# ---------- HomogeneousEffectEstimator (LinearDML) ----------
mc_iters: 1
inference_homo: "statsmodels"

# ---------- HeterogeneousEffectEstimator (CausalForestDML) ----------
n_estimators: 100                # Reduced from 200 for speed
max_depth: 30                    # Reduced from 50 to prevent overfitting
min_samples_leaf: 5000           # Increased from 5 to 5000 (0.1% of 5M)
subforest_size: 4
inference_hetero: "blb"
max_samples: 0.2                 # Reduced from 0.5 (uses 1M samples per tree)
# min_impurity_decrease: REMOVED - THIS WAS CAUSING ZEROS!
min_balancedness_tol: 0.45
honest: true

# =============================================================================
# SECTION 3: LIGHTGBM PARAMETERS - OPTIMIZED FOR 5M
# =============================================================================

# ---------- Core Parameters ----------
objective: "regression"
metric: "rmse"
boosting_type: "gbdt"
verbosity: -1
seed: 42

# ---------- Tree Structure (optimized for 5M) ----------
num_leaves: 31                   # Keeping at 31 for stability
min_data_in_leaf: 50             # Increased from 20 (5M // 100,000)
lgbm_max_depth: -1
learning_rate: 0.1
num_iterations: 100

# ---------- Histogram & Binning ----------
max_bin: 127                     # Keeping at 127 for faster computation

# ---------- Sampling Parameters (optimized for 5M) ----------
feature_fraction: 0.9
feature_fraction_bynode: 0.9
bagging_fraction: 0.8            # Reduced from 0.9 for >1M samples
bagging_freq: 1                  # Enabled for >1M samples

# ---------- Other Training ----------
first_metric_only: true

# ---------- Categorical Handling ----------
cat_smooth: 10
max_cat_to_onehot: 4
categorical_feature: "auto"

# ---------- Missing Value & Advanced ----------
use_missing: true
zero_as_missing: false
feature_pre_filter: true
extra_trees: false

# =============================================================================
# PERFORMANCE NOTES FOR 5M SAMPLES
# =============================================================================
# 
# Expected performance with this config:
# - Runtime: ~30-60 minutes on 80-core machine
# - Memory: ~15-30 GB peak
# - Feature importances: Will work correctly (min_impurity_decrease removed)
#
# Further optimizations if needed:
# 1. Reduce n_estimators to 50 for 2x speedup
# 2. Reduce max_samples to 0.1 for 2x speedup
# 3. Use spatial_step > 1 to subsample data
# 4. Set cache_values: false in code to save memory
#
# Monitor during run:
# - If memory issues: reduce max_samples or increase spatial_step
# - If too slow: reduce n_estimators or cv_folds
# - If trees too deep: increase min_samples_leaf further
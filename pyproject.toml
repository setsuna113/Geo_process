[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodiversity-geoprocessing"
version = "1.0.0"
description = "Biodiversity data geoprocessing and statistical analysis pipeline"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Biodiversity Analysis Team", email = "noreply@example.com"},
]
keywords = ["biodiversity", "geoprocessing", "spatial-analysis", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "rasterio>=1.2.0",
    "geopandas>=0.10.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "h2o>=3.40.0",
    "cartopy>=0.20.0",
    "pyproj>=3.2.0",
    "shapely>=1.8.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
tensor = [
    "tensorly>=0.8.0",
    "scikit-tensor>=0.4.0",
]

[project.urls]
"Homepage" = "https://github.com/setsuna113/Geo_process"
"Bug Reports" = "https://github.com/setsuna113/Geo_process/issues"
"Source" = "https://github.com/setsuna113/Geo_process"

[project.scripts]
biodiversity-analysis = "src.biodiversity_analysis.methods.stat.runner:main"
run-biodiversity-analysis = "run_biodiversity_analysis:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
"src.config" = ["*.yml", "*.yaml", "*.json"]
"src.config.som" = ["*.yml", "*.yaml"]
"src.config.cpwopt" = ["*.yml", "*.yaml"] 
"src.config.stat" = ["*.yml", "*.yaml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
    "src",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "rasterio.*",
    "geopandas.*",
    "cartopy.*",
    "h2o.*",
    "tensorly.*",
    "psycopg2.*",
]
ignore_missing_imports = true